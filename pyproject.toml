[project]
name = "memoria-de-projetos"
version = "1.0.0"
description = "Memória de decisões de projeto: linha do tempo, atas e ficha do empreendimento."
requires-python = ">=3.12"
authors = [
    { name = "Your name", email = "you@example.com" }
]
dependencies = [
    "flet",
    "flet-web",   # servidor web (necessário para publicar como site)
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "reportlab",  # relatório de decisões em PDF
    "pyjwt>=2.8",              # tokens de acesso da API (api/)
    "psycopg[binary]>=3.2",    # PostgreSQL (só com DECIDIU_DATABASE_URL)
]

[project.optional-dependencies]
testes = ["pytest>=8", "httpx>=0.27"]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-desktop"
]

[tool.flet.metadata]
title = "Memória de Projetos"

[tool.flet]
org = "dev.flet"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"
