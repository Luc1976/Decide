# Migrações do banco (Alembic). O endereço do banco NÃO fica aqui: vem de
# DECIDIU_DATABASE_URL (PostgreSQL) ou, sem ela, do SQLite em MEMORIA_DATA_DIR.
#
#   alembic upgrade head                        aplica as migrações pendentes
#   alembic current                             mostra em que versão o banco está
#   alembic revision --autogenerate -m "..."    cria uma migração a partir do modelo
#
# O app (main.py) e a API já rodam "upgrade head" ao iniciar.

[alembic]
script_location = %(here)s/migracoes
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
